<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ALFRZHB responsive review</title><style>body{margin:0;background:#e9e9e9;font:14px system-ui}header{padding:16px;position:sticky;top:0;z-index:1;background:#fff;display:flex;gap:16px;align-items:center}iframe{display:block;border:0;margin:24px auto;background:#faf8f3;box-shadow:0 0 0 1px #d7d7d7;width:405px;height:844px}button{padding:8px;border:1px solid #ccc;border-radius:4px;background:white;cursor:pointer}</style></head><body><header><strong>Responsive review</strong><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button><button id="large-type">200% type</button><span id="size">390px</span></header><iframe title="Portfolio at 390 pixels" src="/"></iframe><script>document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.style.width=(Number(button.dataset.width)+15)+'px';frame.title='Portfolio at '+button.dataset.width+' pixels';document.querySelector('#size').textContent=button.dataset.width+'px'}));document.querySelector('#large-type').addEventListener('click',()=>{const el=document.querySelector('iframe').contentDocument.documentElement;el.style.fontSize=el.style.fontSize?'':'200%'});</script></body></html>
